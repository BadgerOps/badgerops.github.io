<!doctype html>
<html lang="{{ site.Language.Locale }}" data-theme="dark" data-search-index="{{ "index.json" | relURL }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="page-{{ .Kind }}{{ with .Section }} section-{{ . }}{{ end }}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {{ partial "header.html" . }}
    <main id="main-content">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    {{ partial "search.html" . }}
    {{ $js := resources.Get "js/main.js" | minify | fingerprint }}
    <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
  </body>
</html>
