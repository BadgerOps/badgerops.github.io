<header class="site-header" data-header>
  <div class="shell header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="BadgerOps home">
      <img src="{{ "images/badger-mark.svg" | relURL }}" width="38" height="38" alt="">
      <span class="brand-copy"><strong>BadgerOps</strong><small>Field notes</small></span>
    </a>

    <button class="icon-button menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" data-menu-toggle>
      <span></span><span></span>
    </button>

    <nav class="main-nav" aria-label="Main navigation" data-menu>
      {{ range site.Menus.main }}
        <a href="{{ .URL }}"{{ if strings.HasPrefix .URL "http" }} target="_blank" rel="me noopener"{{ end }}{{ if $.IsMenuCurrent .Menu . }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>

    <div class="header-actions">
      <button class="icon-button search-button" type="button" aria-label="Search the field notes" data-search-open>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
        <span class="key-hint">/</span>
      </button>
      <button class="icon-button theme-toggle" type="button" aria-label="Switch color theme" data-theme-toggle>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.6A8.5 8.5 0 0 1 8.4 4a8.5 8.5 0 1 0 11.6 11.6Z"></path></svg>
      </button>
    </div>
  </div>
</header>
