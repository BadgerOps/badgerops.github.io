baseURL = "https://blog.badgerops.net/"
locale = "en-US"
title = "BadgerOps"
enableRobotsTXT = true
enableGitInfo = false
summaryLength = 34

[pagination]
  pagerSize = 9

[permalinks]
  posts = "/:slug/"

[taxonomies]
  topic = "topics"

[outputs]
  home = ["HTML", "RSS", "SearchIndex"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]

[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true
  notAlternative = true

[params]
  description = "Field notes on infrastructure, security, homelabs, open source, and the occasional useful mistake."
  author = "BadgerOps"
  github = "https://github.com/BadgerOps"
  social = "https://x.com/BadgerOps"
  repository = "https://github.com/BadgerOps/badgerops.github.io"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = false
    guessSyntax = true

[privacy]
  [privacy.x]
    enableDNT = true
  [privacy.youtube]
    privacyEnhanced = true

[services]
  [services.rss]
    limit = 20

[[menus.main]]
  name = "Writing"
  pageRef = "/posts"
  weight = 10

[[menus.main]]
  name = "Topics"
  pageRef = "/topics"
  weight = 20

[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 30

[[menus.main]]
  name = "GitHub"
  url = "https://github.com/BadgerOps"
  weight = 40
